            : `<span class="dmark new">new</span>`;
        const clueTag = d.clueLines && d.clueLines.length && state.read.has(d.id) ? `<span class="dmark clues">+${d.clueLines.length}</span>` : '';
        return `<button class="doc${locked ? ' locked' : ''}${newly.has(d.id) ? ' arrive' : ''}" data-doc="${d.id}">
      <span class="dicon">${locked ? ICONS.lock : ICONS[ d.icon ]}</span>
      <span class="dtext"><b>${d.title}</b><i>${locked ? d.lockText : d.sub}</i></span>${clueTag}${mark}</button>`;
      }).join('');
      newly.clear();
    }

    /* ================================================================
       13. evidence engine — the truth-free half of the solver:
          an alive-mask built only from what has been read and inked
    ================================================================ */
    function evidenceMask() {
      const m = new Uint32Array(ALL_MASK);
      CLUES.forEach(c => { if (state.read.has(c._docId)) for (let i = 0; i < WORDS; i++) m[ i ] &= c._mask[ i ]; });
      state.inked.forEach(fk => {
        const p = state.place[ fk ], cm = COL[ FI[ fk ] ][ p ];
        if (cm) for (let i = 0; i < WORDS; i++) m[ i ] &= cm[ i ];
      });
      return m;
    }
    function possibleAt(fk, ev) {
      const out = [];
      for (let p = 0; p < 11; p++)
      {
        const cm = COL[ FI[ fk ] ][ p ]; if (!cm) continue;
        if (masksIntersect(cm, ev)) out.push(p);
      }
      return out;
    }
    function culpritsFor(fk, p) {
      const cm = COL[ FI[ fk ] ][ p ]; if (!cm) return [];
      return CLUES.filter(c => state.read.has(c._docId) && !masksIntersect(c._mask, cm));
    }
    function spotFrames(cl) {
      (cl.frames || []).forEach(fk => {
        const el = stage.querySelector(`.slot[data-slot="${fk}"]`);
        if (el) { el.classList.add('spot'); setTimeout(() => el.classList.remove('spot'), 2600); }
      });
    }

    /* ================================================================
       14. reader / bio / notes / worksheet / derivation
    ================================================================ */
    function notedCount() { return DOCS.reduce((n, d) => n + (state.read.has(d.id) ? d.clueLines.length : 0), 0); }
    function openDoc(id) {
      const d = DOCS.find(x => x.id === id);
      if (!state.unlocked.has(d.id)) { toast('Sealed — ' + d.lockText); snd('reject'); return; }
      const first = !state.read.has(d.id);
      state.read.add(id);
      if (d.populates && !state.indexReady) { state.indexReady = true; toast('Eleven names, entered into the index.'); }
      renderDocs(); renderLedger(); updateStats(); saveState();
      const added = first && d.clueLines.length ? d.clueLines.length : 0;
      if (first && d.prov) toast('Found — ' + d.prov + '.');
      let foot;
      if (d.finale)
      {
        foot = `<div class="finstats"><span>${rank()}</span>
      <span>${fmtTime(state.played)} vs par ${PAR} min · ${[ 'apprentice', 'historian', 'archivist' ][ DIFF ]} trunk · difficulty ${'✦'.repeat(RATING)}${'✧'.repeat(5 - RATING)} · ${state.audits} audit${state.audits === 1 ? '' : 's'} · ${state.whispers} whisper${state.whispers === 1 ? '' : 's'}</span></div>
      <div class="finbtns"><button class="btn" id="show-deriv">The registrar&rsquo;s reasoning</button><button class="btn red" id="replay-btn">Replay the deduction</button><button class="btn" id="copyres">Copy result</button><button class="btn" id="admire">Admire the tree</button><button class="btn red" id="newfam">A different trunk</button></div>`;
      } else if (added)
      {
        foot = `<div class="rfoot"><span class="lbl">Noted</span><i style="font-size:12.5px;color:var(--ink2)">${added} clue${added === 1 ? '' : 's'} added to your case notes.</i>
      <button class="btn" style="margin-left:auto" id="open-notes">Open case notes</button></div>`;
      } else if ((d.postscript || d.id === 'housebook') && first)
      {
        foot = `<div class="rfoot"><span class="lbl">Note</span><i style="font-size:12px;color:var(--ink3)">Nothing new for the ledger — only the family, and its house, in another voice.</i></div>`;
      } else
      {
        foot = `<div class="rfoot"><span class="lbl">Note</span><i style="font-size:12px;color:var(--ink3)">Already among your papers.</i></div>`;
      }
      const exHtml = d._ex ? `<div class="executor"><h4>The Executor&rsquo;s Question</h4><p>${d._ex.q}</p>
    <div class="exrow">${d._ex.options.map((o, i) => `<button class="btn exbtn" data-i="${i}">${o}</button>`).join('')}</div></div>` : '';
      const provHtml = d.prov ? `<p class="provline">✰ ${d.prov}.</p>` : '';
      $('reader-card').innerHTML = `
    <div class="rhead"><span class="dicon">${ICONS[ d.icon ]}</span>
      <div><h3>${d.title}</h3><i>${d.sub}</i></div>
      <button class="icobtn rclose" aria-label="Close">${ICONS.close}</button></div>
    <div class="docbody">${d.body}${exHtml}${provHtml}</div>${foot}`;
      $('reader').classList.add('open');
      $('reader-card').querySelector('.rclose').onclick = () => $('reader').classList.remove('open');
      if (d.finale)
      {
        $('admire').onclick = () => $('reader').classList.remove('open');
        $('newfam').onclick = () => { $('reader').classList.remove('open'); newTrunk(); };
        $('show-deriv').onclick = openDerivation;
        $('replay-btn').onclick = replayDerivation;
        $('copyres').onclick = copyResult;
        if (d._ex)
        {
          $('reader-card').querySelectorAll('.exbtn').forEach(b => b.onclick = () => {
            if (d._ex.done) return;
            if (+b.dataset.i === d._ex.answer)
            {
              d._ex.done = true; b.classList.add('sel');
              $('reader-card').querySelectorAll('.exbtn').forEach(x => x.disabled = true);
              const recs = loadRecs(); recs.executor = (recs.executor || 0) + 1; saveRecs(recs);
              toast('The executor nods slowly, and makes a note in the margin. Commendation earned.');
              snd('reveal');
            } else
            {
              b.disabled = true; b.style.opacity = .4;
              toast('The executor raises an eyebrow. Consider the tree again.');
              snd('reject');
            }
          });
        }
      }
      if (foot && foot.includes('open-notes')) $('open-notes').onclick = () => { $('reader').classList.remove('open'); openNotes(); };
      if (added) { toast(added + ' clue' + (added === 1 ? '' : 's') + ' noted from “' + d.title + '”'); snd('reveal'); }
      snd('flip');
    }
    function openDerivation() {
      const rows = DERIV.map((s, i) => {
        const p = W.P[ s.fk ];
        const docs = [ ...new Set((s.wits || []).map(c => c._doc).filter(Boolean)) ];
        const src = docs.length ? docs.join(' + ') : 'the papers as a whole';
        const tech = TECHS[ stepTech(s) ];
        return `<div class="chron-line"><b>${i + 1}</b><span>${CAPTIONS[ s.fk ]} — <b style="font-family:'IM Fell English',serif;font-weight:400">${p.first} ${p.mar ? W.S : p.sur}</b><br><i style="color:var(--ink3);font-size:12px">by ${tech} — forced by the ${src}</i></span></div>`;
      }).join('');
      $('notes').classList.remove('open');
      $('reader-card').innerHTML = `
    <div class="rhead"><span class="dicon">${ICONS.seal}</span>
      <div><h3>The Registrar&rsquo;s Reasoning</h3><i>Trunk № ${SEED} — every step forced, none guessed</i></div>
      <button class="icobtn rclose" aria-label="Close">${ICONS.close}</button></div>
    <p class="mut" style="text-align:center;margin-bottom:10px">&ldquo;${W.N.voice.aside}&rdquo;</p>
    <p class="mut" style="margin-bottom:12px">The order in which each frame becomes unavoidable — the technique that settles it, and the minimal papers doing the forcing.</p>
    <div class="chron-list">${rows}</div>
    <div class="finbtns"><button class="btn red" id="deriv-replay">Replay the deduction on the tree</button></div>`;
      $('reader').classList.add('open');
      $('reader-card').querySelector('.rclose').onclick = () => $('reader').classList.remove('open');
      $('deriv-replay').onclick = replayDerivation;
      snd('flip');
    }
    function openWorksheet() {
      closeTickPop();
      $('notes').classList.remove('open');
      const ev = evidenceMask();
      const poss = {}; FK.forEach(fk => poss[ fk ] = new Set(possibleAt(fk, ev)));
      const head = PEOPLE.map(p => `<th title="${p.first} ${p.sur}">${p.first.slice(0, 3)}</th>`).join('');
      const rows = FK.map(fk => {
        const inked = state.inked.has(fk), placed = state.place[ fk ];
        const marks = new Set(state.marks[ fk ] || []);
        const cells = PEOPLE.map((p, pi) => {
          let cls = '', txt = '';
          if (inked && FI[ fk ] === pi) { cls = 'wink'; txt = '✓'; }
          else if (!inked && placed === pi) { cls = 'wsk'; txt = '◦'; }
          else if (marks.has(pi)) { cls = 'wtick'; txt = '•'; }
          else if (!poss[ fk ].has(pi)) { cls = 'wex'; }
          return `<td class="${cls}" data-fk="${fk}" data-p="${pi}" title="${p.first} ${p.sur}">${txt}</td>`;
        }).join('');
        return `<tr class="whover"><th class="wrow">${CAPTIONS[ fk ]}${inked ? ` — ${PEOPLE[ FI[ fk ] ].first}` : ''}</th>${cells}</tr>`;
      }).join('');
      $('wksheet-card').innerHTML = `
    <div class="rhead"><span class="dicon">${ICONS.grid}</span>
      <div><h3>The Deduction Worksheet</h3><i>Trunk № ${SEED} — click a square to pencil-tick a candidate</i></div>
      <button class="icobtn rclose" aria-label="Close">${ICONS.close}</button></div>
    <div class="wscroll"><table class="wtable"><thead><tr><th class="wrow">frame ↓ · name →</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="wlegend"><span><b>✓</b> inked</span><span><b>◦</b> sketched</span><span><b>•</b> ticked</span><span style="text-decoration:line-through"><b>&nbsp;&nbsp;</b>&nbsp;ruled out by papers read</span><span><b>&nbsp;</b> open</span></div>
    <p class="mut" style="margin-top:12px;text-align:center">Struck squares come from the papers <em>you have read</em> — cross-check and the ticks never consult the answer. Ticks here match the pencil marks on the tree.</p>`;
      $('wksheet').classList.add('open');
      $('wksheet-card').querySelector('.rclose').onclick = () => $('wksheet').classList.remove('open');
      $('wksheet-card').querySelectorAll('td[data-fk]').forEach(td => {
        td.onclick = () => {
          const fk = td.dataset.fk, pi = +td.dataset.p;
          if (state.inked.has(fk)) return;
          toggleMark(fk, pi);
          openWorksheet();
        };
      });
      snd('flip');
    }
    function bioFor(fk) {
      const p = W.P[ fk ], S = W.S, M = k => W.couples.find(c => c[ 0 ] === k || c[ 1 ] === k)[ 2 ], N = W.N;
      const B = {
        h1: `${p.first} ${S} was born in ${p.b} at ${p.place} and kept the ${p.occ} there for ${p.yrs} years. He married ${W.P.w1.first} ${W.P.w1.sur} in ${M('h1')}; the house on ${p.street} is the one in every photograph.`,
        w1: `${p.first} ${p.sur} married the ${W.P.h1.occ} in ${M('h1')}. She kept every letter she was ever sent — which is why this trunk exists.`,
        h2: `${p.first} ${S}, born ${p.b}, was the ${p.occ} on ${p.street}: exact about dosages, exact about tardiness. Died ${p.d}.`,
        w2: `${p.first} ${p.sur} married the ${W.P.h2.occ} in ${M('h2')}. Her christening gown is folded at the bottom of this trunk, four generations long.`,
        c1: `${p.first} ${S}, born ${p.b}, worked as the town's ${p.occ} for ${p.yrs} years. In ${M('c1')} he married the ${W.P.h2.occ}'s daughter.`,
        c2: `${p.first} ${S}, born ${p.b}, was the village ${p.occ} for ${p.yrs} years. After that she was the keeper of paper — this paper.`,
        c3: `${p.first} ${S}, born ${p.b}, ran the post office counter for ${p.yrs} years and knew everyone's business; which is to say, everyone's birthday.`,
        c4: `${p.first} ${S}, born ${p.b}, took up the ${p.occ} like his father before him. He married ${W.P.e1.first} ${W.P.e1.sur} in ${M('c4')}.`,
        c5: `${p.first} ${S}, born ${p.b}. The youngest on the tree, and the one who kept its birthdays.`,
        e1: `${p.first} ${p.sur}, born ${p.b} in ${p.place}, worked as the town ${p.occ} until her marriage in ${M('c4')}.`,
        you: `You, born ${p.b}. The tree ends with you — and, one day, with someone else's trunk.`
      };
      const nick = N.nicks[ fk ];
      let extra = nick ? ` Known to the family as &ldquo;${nick}&rdquo;, always.` : '';
      const cp = W.couples.find(c => c.includes(fk));
      if (cp && N.anecdotes[ cp[ 0 ] ])
      {
        const pk2 = cp[ 0 ] === fk ? cp[ 1 ] : cp[ 0 ], pp = W.P[ pk2 ];
        extra += ` With ${pp.first} ${pp.mar ? W.S : pp.sur}: ${N.anecdotes[ cp[ 0 ] ]}`;
      }
      return B[ fk ] + extra;
    }
    function openBio(fk) {
      const p = W.P[ fk ];
      $('psheet-card').innerHTML = `
    <div class="rhead"><div><h3>${p.first} ${p.mar ? W.S : p.sur}</h3><i>Generation ${{ h1: 'I', w1: 'I', h2: 'I', w2: 'I', c1: 'II', c2: 'II', c3: 'II', c4: 'III', c5: 'III', e1: 'III', you: 'IV' }[ fk ]}</i></div>
      <button class="icobtn rclose" aria-label="Close" style="margin-left:auto">${ICONS.close}</button></div>
    <div class="sheet-top">
      <div class="sheet-photo" style="background:${TONES[ fk ]}">${sil(p.sex, TONES[ fk ])}</div>
      <div><div class="sheet-dates">${subline(p)}</div></div></div>
    <p class="bio">${bioFor(fk)}</p>
    <p class="sheet-ins">Inscribed on the frame: &ldquo;A ${W.N.months[ fk ]} child, ${W.N.traits[ fk ]}.&rdquo;</p>
    <p class="src">Confirmed by the registrar's ink</p>`;
      $('psheet').classList.add('open');
      $('psheet-card').querySelector('.rclose').onclick = () => $('psheet').classList.remove('open');
      snd('flip');
    }
    function openNotes() {
      const chips = state.indexReady ? PEOPLE.map((p, i) => `<span class="chip"><span class="pthumb">${sil(p.sex)}</span>${p.first} ${p.sur}</span>`).join('')
        : '<i class="mut">Read the Index of Names to populate the ledger.</i>';
      const read = DOCS.filter(d => state.read.has(d.id) && d.clueLines.length);
      const ev = read.length ? read.map(d => `<div class="notes-doc"><h5>${d.title}</h5>${d.clueLines.map((c, i) => {
        const key = d.id + ':' + i, done = state.checked[ key ];
        return `<div class="note-line${done ? ' done' : ''}" data-key="${key}" data-doc="${d.id}" data-i="${i}"><span class="box" title="Mark as used"></span><span class="txt" title="Spot the frames it concerns, and reopen the paper">${c.short}</span></div>`;
      }).join('')
        }</div>`).join('')
        : '<i class="mut">No clues noted yet — examine the trunk\u2019s papers.</i>';
      const unread = DOCS.filter(d => !d.finale && !state.read.has(d.id)).length;
      $('notes-card').innerHTML = `
    <div class="rhead"><span class="dicon">${ICONS.notes}</span>
      <div><h3>Case Notes</h3><i>Trunk № ${SEED} — the ${W.S} family · difficulty ${'✦'.repeat(RATING)}${'✧'.repeat(5 - RATING)}</i></div>
      <button class="icobtn rclose" aria-label="Close">${ICONS.close}</button></div>
    <h4 class="nh">The Index of Names</h4><div class="chiprow">${chips}</div>
    <h4 class="nh">Evidence</h4>${ev}
    ${unread ? `<p class="mut" style="margin-top:10px">${unread} paper${unread === 1 ? '' : 's'} still unread. Click a clue to spotlight the frames it concerns.</p>` : ''}
    <div class="notes-foot"><span>${state.audits} audits</span><span>${state.whispers} whispers</span><span>par ${PAR} min</span><span>${fmtTime(state.played)}</span>
      <button class="btn" id="ws-btn">Worksheet</button>
      <button class="btn" id="deriv-btn">Registrar&rsquo;s reasoning</button>
      <button class="btn" id="whisper-btn">Ask for a whisper</button></div>`;
      $('notes').classList.add('open');
      $('notes-card').querySelector('.rclose').onclick = () => $('notes').classList.remove('open');
      $('whisper-btn').onclick = () => { $('notes').classList.remove('open'); whisper(); };
      $('deriv-btn').onclick = openDerivation;
      $('ws-btn').onclick = openWorksheet;
      $('notes-card').querySelectorAll('.note-line').forEach(l => {
        l.querySelector('.box').onclick = ev2 => { ev2.stopPropagation(); const k = l.dataset.key; state.checked[ k ] = !state.checked[ k ]; saveState(); openNotes(); };
        l.querySelector('.txt').onclick = () => {
          const cl = CLUES.find(x => x._docId === l.dataset.doc && String(x._i) === l.dataset.i);
          if (cl) spotFrames(cl);
          $('notes').classList.remove('open'); openDoc(l.dataset.doc);
        };
      });
    }

    /* ================================================================
       15. placement, audit, cross-check, whisper ladder, replay
    ================================================================ */
    function tickWitnesses(fk) {
      const st = DERIV.find(s => s.fk === fk);
      if (st) (st.wits || []).forEach(c => { if (c._docId != null && c._i != null) state.checked[ c._docId + ':' + c._i ] = true; });
    }
    function placePencil(idx, fk, fromFk) {
      if (replaying) return;
      closeTickPop();
      if (state.inked.has(fk)) { toast('That frame is already confirmed in ink.'); snd('reject'); return; }
      if (fromFk && fromFk !== fk)
      {
        const va = state.place[ fromFk ], vb = state.place[ fk ];
        if (vb === idx) return;
        if (va === idx) { if (vb == null) delete state.place[ fromFk ]; else state.place[ fromFk ] = vb; }
        state.place[ fk ] = idx;
      } else
      {
        for (const k in state.place) if (state.place[ k ] === idx) delete state.place[ k ];
        state.place[ fk ] = idx;
      }
      state.selected = null;
      FK.forEach(paintFrame); renderLedger(); setHints(); snd('pencil'); updateStats(); checkDocUnlocks(); saveState();
    }
    function returnCard(fk) {
      if (state.inked.has(fk) || state.place[ fk ] == null) return;
      delete state.place[ fk ]; paintFrame(fk); renderLedger(); updateStats(); saveState(); snd('flip');
    }
    function checkDocUnlocks() {
      let any = false;
      DOCS.forEach(d => {
        if (d.need == null || state.unlocked.has(d.id)) return;
        if (sketchedCount() >= d.need) { state.unlocked.add(d.id); newly.add(d.id); any = true; toast('New paper in the trunk — ' + d.title); }
      });
      if (any) { renderDocs(); snd('unlock'); }
    }
    function audit() {
      if (state.complete || replaying) return;
      closeTickPop();
      const sk = Object.keys(state.place).map(Number);
      if (!sk.length) { toast('Sketch at least one frame first — pencil before proof.'); snd('reject'); return; }
      state.audits++;
      let right = 0, wrong = 0, fresh = 0, newFk = null;
      sk.forEach(fk => {
        const el = stage.querySelector(`.slot[data-slot="${fk}"]`);
        if (state.place[ fk ] === FI[ fk ])
        {
          right++;
          if (!state.inked.has(fk)) { state.inked.add(fk); fresh++; newFk = fk; tickWitnesses(fk); }
          paintFrame(fk);
        } else
        {
          wrong++;
          if (fk === ERR_FRAME) state.errQ = true;
          el.classList.add('queried');
        }
      });
      renderLedger(); confirmLinks(true); updateStats(); saveState();
      const blank = 11 - sk.length;
      toast(fresh === 0 && wrong === 0
        ? 'The registrar finds nothing to correct. The ledger stands.'
        : `The registrar's ink confirms ${right} of ${sk.length} sketched${wrong ? `, queries ${wrong}` : ''}.${blank ? ` ${blank} frame${blank === 1 ? ' is' : 's are'} still blank.` : ' The rest remain in pencil.'}`);
      if (fresh === 1 && !state.inscribed[ newFk ]) { state.inscribed[ newFk ] = true; toast('Inscribed — ' + insOf(newFk)); }
      snd(fresh > 0 ? 'ink' : wrong > 0 ? 'reject' : 'flip');
      if (state.inked.size === 11) finale();
    }
    function crossCheck() {
      if (state.complete || replaying) return;
      closeTickPop();
      const sk = Object.keys(state.place).map(Number);
      if (!sk.length) { toast('Nothing sketched yet — cross-check needs pencil on the tree.'); snd('flip'); return; }
      const ev = evidenceMask();
      const bad = [];
      sk.forEach(fk => {
        const p = state.place[ fk ];
        if (!possibleAt(fk, ev).includes(p)) bad.push({ fk });
      });
      if (!bad.length)
      {
        toast(`Cross-check: all ${sk.length} sketched frame${sk.length === 1 ? '' : 's'} sit comfortably with every paper you have read. Consistent — for what that's worth.`);
        snd('flip'); return;
      }
      bad.forEach(b => {
        const el = stage.querySelector(`.slot[data-slot="${b.fk}"]`);
        if (el) { el.classList.add('contra'); setTimeout(() => el.classList.remove('contra'), 3200); }
      });
      const b = bad[ 0 ], name = PEOPLE[ state.place[ b.fk ] ].first;
      const culprits = culpritsFor(b.fk, state.place[ b.fk ]);
      toast(culprits.length
        ? `Cross-check: the ${CAPTIONS[ b.fk ]} cannot be ${name} — “${culprits[ 0 ].short}” forbids it.`
        : `Cross-check: taken together, the sketches contradict the papers — at least one placement must move.`);
      snd('reject');
    }
    /* whisper ladder — 1 method, 2 papers, 3 quotes, 4 reveal */
    function whisper() {
      if (state.complete || replaying) return;
      closeTickPop();
      const t = DERIV.find(s => !state.inked.has(s.fk));
      if (!t) { toast('The attic is quiet — every frame already stands in ink.'); return; }
      state.whispers++;
      const lvl = (state.hintLevel[ t.fk ] || 0) + 1;
      state.hintLevel[ t.fk ] = lvl;
      const cap = CAPTIONS[ t.fk ];
      const tech = stepTech(t);
      if (lvl === 1)
      {
        toast(`A whisper (method): ${METHOD[ tech ]}.`);
      } else if (lvl === 2)
      {
        const docs = [ ...new Set((t.wits || []).map(c => c._doc).filter(Boolean)) ];
        toast(docs.length
          ? `A whisper: look again at the ${docs.join(' and the ')} — between them they settle the ${cap}.`
          : `A whisper: the papers as a whole settle the ${cap} — cross-reference everything you've read.`);
      } else if (lvl === 3)
      {
        const wts = t.wits || [];
        if (wts.length) spotFrames({ frames: wts.flatMap(c => c.frames) });
        toast(wts.length
          ? `A whisper: “${wts[ 0 ].short}”${wts[ 1 ] ? ` — and “${wts[ 1 ].short}”` : ''}${wts.length > 2 ? ' — and more in the same paper.' : ''}`
          : `A whisper: only elimination settles the ${cap} — cross off everyone who cannot be.`);
      } else
      {
        state.inked.add(t.fk); state.place[ t.fk ] = FI[ t.fk ];
        if (t.fk === ERR_FRAME) state.errHint = true;
        tickWitnesses(t.fk);

      for (let t = 0; t < 60; t++)
      {
        const ty = Math.floor(Math.random() * 3);
        if (ty === 0)
        {
          const a = picks(); let b = picks(); if (a === b) continue;

          const older = P[ a ].b < P[ b ].b ? a : b;
          const opts = [ nm(a), nm(b) ];
          return { q: `${nm(a)} and ${nm(b)} — two branches of one tree. Which was born first?`, options: opts, answer: opts.indexOf(nm(older)) };
        }

          if (a === b || !P[ a ].d || !P[ b ].d || P[ a ].d === P[ b ].d) continue;
          const longer = (P[ a ].d - P[ a ].b) > (P[ b ].d - P[ b ].b) ? a : b;

        state.unlocked = new Set(s.unlocked && s.unlocked.length ? s.unlocked : [ ...state.unlocked ]);
        state.checked = s.checked || {}; state.audits = s.audits || 0; state.whispers = s.whispers || 0;
        state.complete = !!s.complete; state.played = s.played || 0; state._t = Date.now(); state.indexReady = !!s.indexReady;
        state.marks = s.marks || {}; state.hintLevel = s.hintLevel || {};
        state.errQ = !!s.errQ; state.errHint = !!s.errHint;
      }
      $('brass-plate').textContent = `TRUNK № ${SEED} · THE ${w.S} FAMILY · ${[ 'APPRENTICE', 'HISTORIAN', 'ARCHIVIST' ][ DIFF ]} · ${'✦'.repeat(RATING)}${'✧'.repeat(5 - RATING)}`;
      resetWires(); createSlots(); renderDocs(); renderLedger(); updateStats(); setHints();
      if (state.complete)
      {
        state.unlocked.add('epilogue');
        assembleEpilogue(); /* regenerate the letter for a resumed finished trunk */
        $('seal').classList.add('on');
        links.forEach(l => { if (l.need.every(f => state.inked.has(f))) { l.on = true; l.ink.style.visibility = 'visible'; } });
      }
      $('intro').classList.remove('open');
      saveState();
      if (!state.complete && !state.read.size)
        toast(`Trunk № ${SEED} is open — it arrived with ${seasonPhen()} in the seams. The ${w.N.house} keeps its secrets in paper.`);
    }
    function recsLine() {
      const recs = loadRecs();
      if (!recs.solved) return '';
      let best = null, bd = null;
      Object.keys(recs.best || {}).forEach(d => { const b = recs.best[ d ]; if (b && (!best || b.time < best.time)) { best = b; bd = d; } });
      const daily = (recs.daily || {})[ todayKey() ] ? ' · daily ✓' : '';
      const fl = recs.flawless ? ` · ${recs.flawless} flawless` : '';
      const er = recs.errata ? ` · ${recs.errata} misprint${recs.errata === 1 ? '' : 's'} seen through` : '';
      const ex = recs.executor ? ` · executor ✓${recs.executor}` : '';
      return `<p class="recs">${recs.solved} trunk${recs.solved === 1 ? '' : 's'} solved${best ? ` · best: ${fmtTime(best.time)} (${[ 'Apprentice', 'Historian', 'Archivist' ][ bd ]})` : ''}${fl}${er}${ex}${daily}</p>`;
    }
    function showIntro(mode) {
      const sv = loadSave();
      const recs = loadRecs();
      const diffNames = [ 'Apprentice', 'Historian', 'Archivist' ];
      const diffSubs = [ 'corroborating papers included; every name fairly clued', 'the standard trunk — lean, fair, deductive', 'trimmed to the logical minimum, then re-verified' ];
      const k = todayKey(), dailyDone = (recs.daily || {})[ k ];
      let html;
      if (mode === 'resume' && sv)
      {
        const st = sv.st || {};
        html = `<p class="intro-loc">The ${sv.fam} family · trunk № ${sv.seed}</p>
      <h2>Welcome back</h2>
      <p>You had ${Object.keys(st.place || {}).length} of 11 frames sketched and ${(st.inked || []).length} confirmed in ink, with ${st.audits || 0} audit${st.audits === 1 ? '' : 's'} spent. The trunk is where you left it — letters, keepsakes, the inventory of a house, and whatever else the family was holding.</p>
      ${recsLine()}
      <div class="finbtns" style="margin:22px 0 6px"><button class="btn" id="iv-new2">A different trunk</button><button class="btn red" id="iv-resume">Resume trunk № ${sv.seed}</button></div>`;
      } else
      {
        html = `<p class="intro-loc">Present Day</p>
      <h2>The Family Archive</h2>
      <p>A trunk has arrived with no instructions — only papers and an index of names. Eleven frames stand empty on the tree. Every trunk carries its own small history: a house with a name and rooms, a keepsake that outlasts the paperwork, a family motto nobody remembers coining, letters written in someone's particular voice, and a family with its own names for its own people. The papers exclude as readily as they include, count as readily as they name — and one of them, at least, was written by a hand that slipped.</p>
      <ol class="steps">
        <li><b>I</b><span>Examine the trunk&rsquo;s papers — dates, trades, totals, ranks, coincidences, town events, the pencil marginalia, the house book. Watch for the family&rsquo;s nicknames; the index keeps both names.</span></li>
        <li><b>II</b><span>Sketch your deductions. Keep a clean head with the <b style="width:auto;font-size:13px">Worksheet</b> and <b style="width:auto;font-size:13px">pencil ticks</b> (right-click any frame).</span></li>
        <li><b>III</b><span><b style="width:auto;font-size:13px">Cross-check</b> freely; <b style="width:auto;font-size:13px">audit</b> for ink; ask the attic when stuck — it starts with a <i>method</i>, and only descends to answers.</span></li>
      </ol>
      <p class="verif">Every trunk is machine-verified before it ships: a complete chain of deduction — at each step exactly one name fits — always reaches the answer, each step&rsquo;s technique and minimal evidence are recorded, and no guessing is ever required. The story is generated from the same seed as the facts, so a trunk&rsquo;s number is its whole world.</p>
      <div class="diffrow">${[ 0, 1, 2 ].map(i => `<button class="diffbtn${i === 1 ? ' sel' : ''}" data-d="${i}">${diffNames[ i ]}<small>${diffSubs[ i ]}</small></button>`).join('')}</div>
      <p class="compose-lbl">Reasoning asked of you</p>
      <div class="chiprow" id="composerow" style="justify-content:center;margin:4px 0 2px">${COMPOSE_DEFS.map(d => `<button class="tickchip${COMPOSE.has(d.id) ? ' sel' : ''}" data-t="${d.id}">${d.label}</button>`).join('')}</div>
      <p class="mut" style="margin:2px 0 4px">Direct records and eliminations are always in. Toggle the rest — the engine re-verifies whichever mixture you choose.</p>
      <div class="seedrow"><span>Trunk №</span><input class="seedin" id="seedin" inputmode="numeric" placeholder="blank for a new one" maxlength="9"><span>— same number, same family, same story</span></div>
      <div class="seedrow"><button class="btn" id="btn-daily">The daily trunk — № ${k}</button>${dailyDone ? '<span class="mut">✓ solved today</span>' : ''}</div>
      ${recsLine()}
      <button class="btn red" id="btn-open">Open the trunk</button>`;
      }
      $('intro-card').innerHTML = html;
      if (mode === 'resume' && sv)
      {
        $('iv-resume').onclick = () => startGame(sv.seed, sv.diff || 1, sv);
        $('iv-new2').onclick = () => showIntro('new');
      } else
      {
        $('intro-card').querySelectorAll('.diffbtn').forEach(b => b.onclick = () => {
          $('intro-card').querySelectorAll('.diffbtn').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
        });
        $('intro-card').querySelectorAll('#composerow .tickchip').forEach(b => b.onclick = () => {
          const t = b.dataset.t;
          if (COMPOSE.has(t)) { COMPOSE.delete(t); b.classList.remove('sel'); }
          else { COMPOSE.add(t); b.classList.add('sel'); }
          saveCompose(); snd('flip');
        });
        $('btn-daily').onclick = () => {
          const diff = parseInt($('intro-card').querySelector('.diffbtn.sel').dataset.d, 10);
          startGame(k, diff);
        };
        $('btn-open').onclick = () => {
          const raw = ($('seedin').value || '').trim();
          const seed = /^\d{3,9}$/.test(raw) ? parseInt(raw, 10) : null;
          const diff = parseInt($('intro-card').querySelector('.diffbtn.sel').dataset.d, 10);
          startGame(seed, diff);
        };
      }
    }
    (function init() { showIntro(loadSave() ? 'resume' : 'new'); })();

    /* ================================================================
       23. keys & scaling
    ================================================================ */
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape')
      {
        closeTickPop();
        if ($('intro').classList.contains('open')) return;
        [ 'reader', 'psheet', 'notes', 'wksheet' ].forEach(id => $(id).classList.remove('open'));
        if (state.selected) { state.selected = null; renderLedger(); setHints(); }
        return;
      }
      if ($('intro').classList.contains('open') || !W) return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'n' || e.key === 'N') openNotes();
      else if (e.key === 'a' || e.key === 'A') audit();
      else if (e.key === 'c' || e.key === 'C') crossCheck();
      else if (e.key === 'h' || e.key === 'H') whisper();
      else if (e.key === 'e' || e.key === 'E') $('btn-eraser').click();
      else if (e.key === 'w' || e.key === 'W')
      {
        if ($('wksheet').classList.contains('open')) $('wksheet').classList.remove('open');
        else openWorksheet();
      }
    });
    [ 'reader', 'psheet', 'notes', 'wksheet' ].forEach(id => {
      $(id).addEventListener('pointerdown', e => { if (e.target === $(id)) $(id).classList.remove('open'); });
    });
    new ResizeObserver(() => {
      const r = vp.getBoundingClientRect();
      const s = Math.min(r.width / 1030, r.height / 790, 1.15);
      stage.style.transform = `translate(-50%,-50%) scale(${s})`;
    }).observe(vp);
  </script>
</body>

</html>
